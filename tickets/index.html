<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JWC Field Tickets</title>
<meta name="theme-color" content="#0b0c0f">
<style>
*{box-sizing:border-box}html{scroll-padding-top:20px;color-scheme:dark}body{margin:0;background:#0b0c0f;color:#eee;font:16px system-ui,Arial,sans-serif}a{color:#e5e7eb}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}header{padding:12px 16px;border-bottom:1px solid #30343b;display:flex;justify-content:space-between;align-items:center;gap:16px;background:#101216}header .brand{width:150px;overflow:hidden;mask-image:radial-gradient(ellipse,#000 40%,transparent 75%)}header .brand-logo{display:block;width:143%;height:auto;margin-left:-43%}header>a{padding:12px 4px;font-size:14px;text-decoration:none;font-weight:650}main{max-width:900px;margin:0 auto;padding:26px 16px 145px}.heading{display:flex;align-items:center;justify-content:space-between;gap:16px}.heading a{font-size:14px;padding:12px 0;white-space:nowrap}h1{font-size:30px;letter-spacing:-.03em;margin:0}h2{font-size:22px;margin:0 0 18px}.subtitle{margin:8px 0 18px;color:#b8bec7;line-height:1.5}.note{padding:12px 14px;border:1px solid #3c424b;border-radius:8px;background:#171b21;color:#c4cad3;font-size:13px;line-height:1.6;margin:0 0 22px}.panel{padding:20px 16px;border:1px solid #343a43;border-radius:12px;background:#13161b}fieldset{border:0;padding:0;margin:0 0 28px;min-width:0}fieldset:last-of-type{margin-bottom:0}legend{padding:0;margin-bottom:18px;color:#f2f3f5;font-size:18px;font-weight:750;width:100%}.section-number{color:#919aa8;font-size:12px;letter-spacing:.1em;margin-right:10px}.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}.grid>div{min-width:0}label,.field-label{display:block;font-size:14px;color:#dce1e8;font-weight:650;margin-bottom:8px}.optional{font-weight:400;color:#959fac;font-size:12px}input,select,textarea{display:block;min-width:0;max-width:100%;width:100%;min-height:52px;background:#20252d;color:#fff;border:1px solid #525d6c;border-radius:8px;padding:14px 12px;font-size:16px}input[type=date]{appearance:none;-webkit-appearance:none;min-height:54px}textarea{min-height:140px;resize:vertical;line-height:1.5}input::placeholder,textarea::placeholder{color:#9ba5b2;opacity:1}input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #e0e5ec;outline-offset:3px}.wide{grid-column:1/-1}.checks{display:grid;grid-template-columns:1fr;gap:10px}.checks label{display:flex;align-items:center;gap:12px;margin:0;padding:13px 14px;min-height:52px;border:1px solid #525d6c;border-radius:8px;background:#20252d;cursor:pointer}.checks label:has(input:checked){border-color:#dde3ec;background:#303844}.checks input{appearance:auto;width:22px;height:22px;min-height:0;margin:0;flex-shrink:0;accent-color:#dce2eb}button{min-height:48px;padding:13px 16px;border:0;border-radius:8px;font-weight:750;cursor:pointer;background:linear-gradient(120deg,#9ca3ad,#f1f3f5,#a5adb7);color:#101216}.secondary{background:#222831;color:#e8ecf2;border:1px solid #525d6c}.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.tools button:last-child{grid-column:1/-1}.savebar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#101216f5;border-top:1px solid #454e5b}.savebar-inner{max-width:868px;margin:auto}.savebar button{width:100%;min-height:54px;font-size:16px}.status{font-size:13px;line-height:1.45;color:#c3e5c8;margin:0 0 10px}.status:empty{display:none}#history{margin-top:28px;scroll-margin-top:20px}#list{color:#b8c1cd;line-height:1.5}.item{border-top:1px solid #343d49;padding:16px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}.item:last-child{padding-bottom:0}.ticket-details{min-width:0;overflow-wrap:anywhere}.ticket-details strong{display:block;color:#f1f3f5;font-size:16px}.ticket-details small{display:block;color:#aab4c2;margin-top:5px;font-size:13px}.item button{min-width:64px}.empty{margin:0;color:#aab4c2;font-size:14px}
@media(min-width:600px){main{padding-top:36px}.panel{padding:26px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.checks{grid-template-columns:repeat(3,minmax(0,1fr))}.tools{grid-template-columns:repeat(3,1fr)}.tools button:last-child{grid-column:auto}header{padding:12px max(24px,calc((100vw - 868px)/2))}}
@media print{html{color-scheme:light}header,.savebar,.tools,#history,.note,.heading a,.subtitle{display:none!important}body{background:white;color:black}main{padding:0;max-width:none}.panel{border:0;background:white;padding:0}h1{margin-bottom:20px}legend,label,.field-label{color:black}.section-number,.optional{color:#555}.grid{grid-template-columns:1fr 1fr;gap:12px}fieldset{margin-bottom:20px;break-inside:avoid}input,select,textarea{color:black;border:0;border-bottom:1px solid #aaa;border-radius:0;background:white;padding:6px;min-height:32px}.checks{grid-template-columns:repeat(3,1fr)}.checks label{color:black;background:white;border:0;padding:4px}.checks label:has(input:checked){background:white}.checks input{accent-color:black}textarea{min-height:80px}.status{display:none}}
</style>
</head>
<body>
<header><div class="brand"><img class="brand-logo" src="../assets/jwc-logo.png" alt="JWC Contracting Ltd."></div><a href="../">Back to website</a></header>
<main>
<div class="heading"><h1>Field Ticket</h1><a href="#history">Saved tickets</a></div>
<p class="subtitle">Enter the job details, then save your ticket.</p>
<p class="note">Tickets are saved on this device and browser only. Google Sheets sync is not connected. Export CSV to keep a backup.</p>
<section class="panel" aria-label="Ticket details">
<form id="form">
<fieldset><legend><span class="section-number">01</span>Job details</legend><div class="grid">
<div><label for="date">Date</label><input id="date" type="date" required></div>
<div><label for="customer">Customer</label><select id="customer" required><option value="">Select customer</option><option>Weaver Group Ltd</option><option>River Valley Energy Services</option><option>Ruel Concrete</option></select></div>
<div class="wide"><label for="job">Job number <span class="optional">Optional</span></label><input id="job" placeholder="Enter job number"></div>
</div></fieldset>
<fieldset><legend><span class="section-number">02</span>Truck &amp; driver</legend><div class="grid">
<div><label for="truck">Truck number</label><select id="truck" required><option value="">Select truck</option><option>820</option><option>822</option><option>823</option><option>824</option></select></div>
<div><label for="driver">Driver name</label><select id="driver"><option>Jordan Cowan</option></select></div>
<div class="wide"><label for="hours">Truck hours</label><input id="hours" type="number" min="0" step="0.25" inputmode="decimal" placeholder="e.g. 8.5" required></div>
</div></fieldset>
<fieldset><legend><span class="section-number">03</span>Equipment &amp; work</legend><div class="grid">
<div class="wide"><span class="field-label" id="equipment-label">Equipment used</span><div class="checks" role="group" aria-labelledby="equipment-label"><label><input type="checkbox" id="jeep">Jeep</label><label><input type="checkbox" id="booster">Booster</label><label><input type="checkbox" id="tridem">Tridem</label></div></div>
<div class="wide"><label for="work">Description of work <span class="optional">Optional</span></label><textarea id="work" placeholder="Describe the haul, locations, and any job notes"></textarea></div>
</div></fieldset>
<div class="tools"><button type="button" class="secondary" id="clear">New ticket</button><button type="button" class="secondary" onclick="window.print()">Print / PDF</button><button type="button" class="secondary" id="csv">Export CSV</button></div>
<div class="savebar"><div class="savebar-inner"><p class="status" id="status" role="status" aria-live="polite"></p><button type="submit">Save ticket</button></div></div>
</form>
</section>
<section class="panel" id="history"><h2>Saved tickets</h2><div id="list"></div></section>
</main>
<script>const $=id=>document.getElementById(id),key='jwc-tickets-v1';let editing=null;const fields=['date','customer','job','truck','driver','hours','work'];function all(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return []}}function saveAll(a){localStorage.setItem(key,JSON.stringify(a))}function reset(){editing=null;$('form').reset();$('date').value=new Date().toLocaleDateString('en-CA');$('status').textContent=''}function render(){const a=all();$('list').replaceChildren();if(!a.length){$('list').textContent='No saved tickets yet.';return}a.slice().reverse().forEach(t=>{let d=document.createElement('div');d.className='item';let s=document.createElement('div');s.className='ticket-details';let title=document.createElement('strong');title.textContent=t.customer;let meta=document.createElement('small');meta.textContent=t.date+' · Truck '+t.truck+' · '+t.hours+' hrs';s.append(title,meta);let b=document.createElement('button');b.textContent='Open';b.onclick=()=>{editing=t.id;fields.forEach(k=>$(k).value=t[k]??'');['jeep','booster','tridem'].forEach(k=>$(k).checked=!!t[k]);window.scrollTo(0,0)};d.append(s,b);$('list').append(d)})}$('form').onsubmit=e=>{e.preventDefault();let t={id:editing||String(Date.now())};fields.forEach(k=>t[k]=$(k).value);['jeep','booster','tridem'].forEach(k=>t[k]=$(k).checked);let a=all(),i=a.findIndex(x=>x.id===t.id);if(i>=0)a[i]=t;else a.push(t);try{saveAll(a);editing=t.id;$('status').textContent='Saved on this device. Not yet sent to Google Sheets.';render()}catch{$('status').textContent='Could not save ticket on this device.'}};$('clear').onclick=reset;$('csv').onclick=()=>{let a=all();if(!a.length)return alert('No saved tickets');let cols=['date','customer','job','truck','driver','hours','jeep','booster','tridem','work'];let csv=[cols,...a.map(t=>cols.map(k=>t[k]??''))].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let u=URL.createObjectURL(new Blob([csv],{type:'text/csv'})),link=document.createElement('a');link.href=u;link.download='JWC-tickets.csv';link.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};reset();render();</script></body></html>
