<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JWC Field Tickets</title><meta name="theme-color" content="#101114"><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 25%,#30353b,#0b0c0f 60%);background-attachment:fixed;color:#eee;font:16px system-ui,Arial}header{padding:18px 5%;border-bottom:1px solid #555;display:flex;justify-content:space-between;align-items:center}header b{font-size:28px;letter-spacing:4px;color:#dfe3e6}a{color:#d4d8dd}main{max-width:850px;margin:25px auto;padding:0 18px}h1{font-size:26px}p,small{color:#bac0c6}.panel{padding:22px;border:1px solid #5b6269;border-radius:12px;background:#14171bb8;backdrop-filter:blur(5px)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-size:13px;color:#d6dbe0;font-weight:700;margin-bottom:6px}input,select,textarea{width:100%;background:#24282d;color:#fff;border:1px solid #626a73;border-radius:6px;padding:13px;font:inherit}textarea{min-height:95px}.wide{grid-column:1/-1}.checks{display:flex;gap:16px;flex-wrap:wrap;padding-top:9px}.checks label{display:flex;align-items:center;gap:6px}.checks input{width:auto}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}button{padding:12px 17px;background:linear-gradient(120deg,#969ca3,#f2f3f4,#8e959d);border:0;border-radius:6px;color:#101114;font-weight:800;cursor:pointer}.secondary{background:#30363c;color:#eee;border:1px solid #747c84}.item{border-top:1px solid #535960;padding:12px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.item button{font-size:12px;padding:8px}.status{min-height:24px;color:#b8d9bc}@media(max-width:560px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}header b{font-size:20px}}@media print{header,.buttons,#history,.note{display:none}body{background:white;color:black}.panel{border:0;background:white;padding:0}input,select,textarea{color:black;border:0;border-bottom:1px solid #aaa;background:white}.checks label{color:black}}</style></head><body><header><div><b>JWC</b><div>CONTRACTING LTD.</div></div><a href="../">Home</a></header><main><h1>Field Ticket</h1><p class="note">Demo: tickets save in this browser only. Google Sheets synchronization is not connected yet.</p><section class="panel"><form id="form"><div class="grid"><div><label for="date">Date</label><input id="date" type="date" required></div><div><label for="customer">Customer</label><select id="customer" required><option value="">Select customer</option><option>Weaver Group Ltd</option><option>River Valley Energy Services</option><option>Ruel Concrete</option></select></div><div><label for="job">Job Number</label><input id="job" placeholder="Job number"></div><div><label for="truck">Truck Number</label><select id="truck" required><option value="">Select truck</option><option>820</option><option>822</option><option>823</option><option>824</option></select></div><div><label for="driver">Driver Name</label><select id="driver"><option>Jordan Cowan</option></select></div><div><label for="hours">Truck Hours</label><input id="hours" type="number" min="0" step="0.25" required></div><div class="wide"><label>Equipment Used</label><div class="checks"><label><input type="checkbox" id="jeep"> Jeep</label><label><input type="checkbox" id="booster"> Booster</label><label><input type="checkbox" id="tridem"> Tridem</label></div></div><div class="wide"><label for="work">Description of Work</label><textarea id="work"></textarea></div></div><div class="buttons"><button type="submit">Save Ticket</button><button type="button" class="secondary" onclick="window.print()">Print / PDF</button><button type="button" class="secondary" id="clear">New Ticket</button><button type="button" class="secondary" id="csv">Export CSV</button></div><p class="status" id="status" role="status"></p></form></section><section class="panel" id="history" style="margin-top:20px"><h2>Saved Tickets</h2><div id="list"></div></section></main><script>const $=id=>document.getElementById(id),key='jwc-tickets-v1';let editing=null;const fields=['date','customer','job','truck','driver','hours','work'];function all(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return []}}function saveAll(a){localStorage.setItem(key,JSON.stringify(a))}function reset(){editing=null;$('form').reset();$('date').value=new Date().toLocaleDateString('en-CA');$('status').textContent=''}function render(){const a=all();$('list').replaceChildren();if(!a.length){$('list').textContent='No saved tickets yet.';return}a.slice().reverse().forEach(t=>{let d=document.createElement('div');d.className='item';let s=document.createElement('span');s.textContent=t.date+' · '+t.customer+' · Truck '+t.truck+' · '+t.hours+' hrs';let b=document.createElement('button');b.textContent='Open';b.onclick=()=>{editing=t.id;fields.forEach(k=>$(k).value=t[k]||'');['jeep','booster','tridem'].forEach(k=>$(k).checked=!!t[k]);window.scrollTo(0,0)};d.append(s,b);$('list').append(d)})}$('form').onsubmit=e=>{e.preventDefault();let t={id:editing||String(Date.now())};fields.forEach(k=>t[k]=$(k).value);['jeep','booster','tridem'].forEach(k=>t[k]=$(k).checked);let a=all(),i=a.findIndex(x=>x.id===t.id);if(i>=0)a[i]=t;else a.push(t);try{saveAll(a);editing=t.id;$('status').textContent='Saved on this device. Not yet sent to Google Sheets.';render()}catch{$('status').textContent='Could not save ticket on this device.'}};$('clear').onclick=reset;$('csv').onclick=()=>{let a=all();if(!a.length)return alert('No saved tickets');let cols=['date','customer','job','truck','driver','hours','jeep','booster','tridem','work'];let csv=[cols,...a.map(t=>cols.map(k=>t[k]??''))].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let u=URL.createObjectURL(new Blob([csv],{type:'text/csv'})),link=document.createElement('a');link.href=u;link.download='JWC-tickets.csv';link.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};reset();render();</script></body></html>
